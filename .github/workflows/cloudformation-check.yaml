
name: CloudFormation CI

# 実行するきっかけ
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# GitHubの認証権限を読み取り専用にする
permissions:
  contents: read

jobs:
  validate:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudformation

    steps:
      # 1. GitHubのコードを取得
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Pythonを準備
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 3. cfn-lintをインストール
      - name: Install cfn-lint
        run: |
          python -m pip install cfn-lint
          cfn-lint --version

      # 4. CloudFormation Guardをインストール
      - name: Install CloudFormation Guard
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/aws-cloudformation/cloudformation-guard/main/install-guard.sh | sh

          echo "$HOME/.guard/bin" >> "$GITHUB_PATH"

      # 5. Guardのバージョンを確認
      - name: Check Guard version
        run: cfn-guard --version

      # 6. CloudFormationの構文チェック
      - name: Run cfn-lint
        run: |
          cfn-lint -t templates/*.yaml

      # 7. Guardルールの単体テスト
      - name: Run Guard tests
        run: |
          cfn-guard test \
            --rules-file guard/rules/rds.guard \
            --test-data guard/tests/rds_tests.yaml

      # 8. RDSテンプレートのセキュリティ検証
      - name: Validate RDS security
        run: |
          cfn-guard validate \
            --rules guard/rules/rds.guard \
            --data templates/database.yaml \
            --type CFNTemplate \
            --show-summary all
