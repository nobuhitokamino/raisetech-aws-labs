
name: AWS OIDC Verify

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify AWS OIDC
    runs-on: ubuntu-latest

    steps:
      # リポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v7

      # Terraform CLIを準備
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.17.2'

      # OIDC認証
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: RaiseTechOIDCVerify

      # IAM Roleの確認
      - name: Verify assumed IAM Role
        run: aws sts get-caller-identity

      # Terraform Stateの読み取り確認
      - name: Verify Terraform State Access
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          aws s3api head-object \
            --bucket "aws-multi-az-portfolio-state-${ACCOUNT_ID}-apne1" \
            --key "raisetech-aws-labs/dev/terraform.tfstate" \
            --query 'ContentLength' \
            --output text

      # 実際のS3 Backendで初期化
      - name: Terraform Backend Init
        working-directory: terraform/environments/dev
        run: terraform init -input=false -no-color
