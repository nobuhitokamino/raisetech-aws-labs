
name: Terraform CI

# ワークフローの実行条件
on:
  push:
    branches:
      - main
      - feature/terraform-cicd
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-check.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-check.yaml'

  workflow_dispatch:

# GitHubリポジトリへの権限
permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      # 1. GitHubリポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Terraform CLIを準備
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.17.2'

      # 3. フォーマット検証
      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform

      # 4. Backend接続なしで初期化
      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init -backend=false -input=false

      # 5. Terraform構成の検証
      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate -no-color

      # 6. Pythonを準備
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 7. Checkovをインストール
      - name: Install Checkov
        run: |
          python -m pip install 'checkov==3.4.6'
          checkov --version

      # 8. Terraformのセキュリティ検証
      - name: Check Terraform Security
        run: |
          checkov \
            --directory terraform \
            --framework terraform \
            --check CKV_AWS_17,CKV_AWS_16,CKV_AWS_24
