
name: Terraform Apply OIDC Verify

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'SNS test operation'
        required: true
        type: choice
        default: create
        options:
          - create
          - cleanup

      subscription_arn:
        description: 'Subscription ARN (required for cleanup)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify Apply Role OIDC
    runs-on: ubuntu-latest

    # SNS検証のためfeatureブランチから実行
    if: github.ref == 'refs/heads/feature/terraform-cicd'

    # Apply専用Environment
    environment: terraform-apply

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: RaiseTechApplyOIDCVerify

      - name: Verify assumed Apply Role
        run: aws sts get-caller-identity

      # SNS Topicが存在しないことを確認
      - name: Verify SNS Topic Does Not Exist
        if: inputs.operation == 'create'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query 'Account' \
            --output text)

          TOPIC_ARN="arn:aws:sns:ap-northeast-1:${ACCOUNT_ID}:raisetech-tf-monitoring-alerts"

          if RESULT=$(aws sns get-topic-attributes \
            --topic-arn "$TOPIC_ARN" 2>&1); then

            echo "Error: SNS Topic already exists."
            exit 1

          elif [[ "$RESULT" == *"(NotFound)"* ]]; then

            echo "SNS Topic does not exist. Proceeding."

          else

            echo "$RESULT"
            exit 1

          fi

      # SNS Topicの作成
      - name: Create SNS Topic
        if: inputs.operation == 'create'
        id: sns_topic
        run: |
          TOPIC_ARN=$(aws sns create-topic \
            --name raisetech-tf-monitoring-alerts \
            --tags Key=Project,Value=raisetech-aws-labs Key=ManagedBy,Value=SNSVerification \
            --query 'TopicArn' \
            --output text)

          echo "topic_arn=$TOPIC_ARN" >> "$GITHUB_OUTPUT"

      # SNS Topicのタグ設定
      - name: Tag SNS Topic
        if: inputs.operation == 'create'
        env:
          TOPIC_ARN: ${{ steps.sns_topic.outputs.topic_arn }}
        run: |
          aws sns tag-resource \
            --resource-arn "$TOPIC_ARN" \
            --tags Key=Project,Value=raisetech-aws-labs Key=ManagedBy,Value=SNSVerification

      # SNS Topicの属性取得
      - name: Get SNS Topic Attributes
        if: inputs.operation == 'create'
        env:
          TOPIC_ARN: ${{ steps.sns_topic.outputs.topic_arn }}
        run: |
          aws sns get-topic-attributes \
            --topic-arn "$TOPIC_ARN"

      # SNS Topicのタグ確認
      - name: List SNS Topic Tags
        if: inputs.operation == 'create'
        env:
          TOPIC_ARN: ${{ steps.sns_topic.outputs.topic_arn }}
        run: |
          aws sns list-tags-for-resource \
            --resource-arn "$TOPIC_ARN"

      # SNSメール購読登録
      - name: Subscribe SNS Email
        if: inputs.operation == 'create'
        env:
          TOPIC_ARN: ${{ steps.sns_topic.outputs.topic_arn }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          aws sns subscribe \
            --topic-arn "$TOPIC_ARN" \
            --protocol email \
            --notification-endpoint "$NOTIFICATION_EMAIL" \
            --return-subscription-arn

      # 削除対象の確認
      - name: Verify Cleanup Target
        if: inputs.operation == 'cleanup'
        id: cleanup_target
        env:
          SUBSCRIPTION_ARN: ${{ inputs.subscription_arn }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query 'Account' \
            --output text)

          TOPIC_ARN="arn:aws:sns:ap-northeast-1:${ACCOUNT_ID}:raisetech-tf-monitoring-alerts"

          if [[ "$SUBSCRIPTION_ARN" != "$TOPIC_ARN":* ]]; then
            echo "Error: Invalid subscription ARN."
            exit 1
          fi

          MANAGED_BY=$(aws sns list-tags-for-resource \
            --resource-arn "$TOPIC_ARN" \
            --query "Tags[?Key=='ManagedBy'].Value | [0]" \
            --output text)

          if [[ "$MANAGED_BY" != "SNSVerification" ]]; then
            echo "Error: Topic is not managed by SNSVerification."
            exit 1
          fi

          echo "topic_arn=$TOPIC_ARN" >> "$GITHUB_OUTPUT"
          echo "Cleanup target verified."

      # SNS Subscriptionの属性取得
      - name: Get SNS Subscription Attributes
        if: inputs.operation == 'cleanup'
        env:
          SUBSCRIPTION_ARN: ${{ inputs.subscription_arn }}
          TOPIC_ARN: ${{ steps.cleanup_target.outputs.topic_arn }}
        run: |
          CONFIRMED_TOPIC=$(aws sns get-subscription-attributes \
            --subscription-arn "$SUBSCRIPTION_ARN" \
            --query 'Attributes.TopicArn' \
            --output text)

          if [[ "$CONFIRMED_TOPIC" != "$TOPIC_ARN" ]]; then
            echo "Error: Subscription topic mismatch."
            exit 1
          fi

          PENDING=$(aws sns get-subscription-attributes \
            --subscription-arn "$SUBSCRIPTION_ARN" \
            --query 'Attributes.PendingConfirmation' \
            --output text)

          if [[ "$PENDING" != "false" ]]; then
            echo "Error: Subscription is not confirmed."
            exit 1
          fi

          echo "Subscription attributes verified."

      # SNS Subscriptionの解除
      - name: Unsubscribe SNS Email
        if: inputs.operation == 'cleanup'
        env:
          SUBSCRIPTION_ARN: ${{ inputs.subscription_arn }}
        run: |
          aws sns unsubscribe \
            --subscription-arn "$SUBSCRIPTION_ARN"

          echo "Subscription successfully removed."

      # SNS Topicの削除
      - name: Delete SNS Topic
        if: inputs.operation == 'cleanup'
        env:
          TOPIC_ARN: ${{ steps.cleanup_target.outputs.topic_arn }}
        run: |
          aws sns delete-topic \
            --topic-arn "$TOPIC_ARN"

          echo "SNS Topic successfully deleted."
