
---
- name: restricted_ssh
  input:
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 22
              ToPort: 22
              CidrIp: 203.0.113.10/32
  expectations:
    rules:
      NO_PUBLIC_SSH: PASS

- name: public_ssh
  input:
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 22
              ToPort: 22
              CidrIp: 0.0.0.0/0
  expectations:
    rules:
      NO_PUBLIC_SSH: FAIL

- name: public_http
  input:
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 80
              ToPort: 80
              CidrIp: 0.0.0.0/0
  expectations:
    rules:
      NO_PUBLIC_SSH: PASS

- name: public_port_range
  input:
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 20
              ToPort: 30
              CidrIp: 0.0.0.0/0
  expectations:
    rules:
      NO_PUBLIC_SSH: FAIL

- name: no_security_group
  input:
    Resources: {}
  expectations:
    rules:
      NO_PUBLIC_SSH: SKIP

- name: public_ssh_using_ref
  input:
    Parameters:
      SSHCidr:
        Type: String
        Default: 0.0.0.0/0
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 22
              ToPort: 22
              CidrIp:
                Ref: SSHCidr
  expectations:
    rules:
      NO_PUBLIC_SSH: FAIL

- name: safe_ssh_using_ref
  input:
    Parameters:
      SSHCidr:
        Type: String
        Default: 203.0.113.10/32
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 22
              ToPort: 22
              CidrIp:
                Ref: SSHCidr
  expectations:
    rules:
      NO_PUBLIC_SSH: FAIL

- name: http_using_ref
  input:
    Parameters:
      HTTPCidr:
        Type: String
        Default: 0.0.0.0/0
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 80
              ToPort: 80
              CidrIp:
                Ref: HTTPCidr
  expectations:
    rules:
      NO_PUBLIC_SSH: PASS

- name: restricted_myip_ref
  input:
    Parameters:
      MyIP:
        Type: String
        AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32$'
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 22
              ToPort: 22
              CidrIp:
                Ref: MyIP
  expectations:
    rules:
      NO_PUBLIC_SSH: PASS


- name: myip_without_allowed_pattern
  input:
    Parameters:
      MyIP:
        Type: String
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 22
              ToPort: 22
              CidrIp:
                Ref: MyIP
  expectations:
    rules:
      NO_PUBLIC_SSH: FAIL

- name: myip_with_unsafe_pattern
  input:
    Parameters:
      MyIP:
        Type: String
        AllowedPattern: '.*'
    Resources:
      MySecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
          SecurityGroupIngress:
            - IpProtocol: tcp
              FromPort: 22
              ToPort: 22
              CidrIp:
                Ref: MyIP
  expectations:
    rules:
      NO_PUBLIC_SSH: FAIL

