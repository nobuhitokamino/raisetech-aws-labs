AWSTemplateFormatVersion: '2010-09-09'
Description: Security Stack
Parameters:
  MyIP:
    Type: String
    Description: 'Your IP Address example: 10.11.12.13/32'

  VpcId:
    Type: AWS::EC2::VPC::Id

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

# EC2SecurityGroup
Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http https to client host
      GroupName: raisetech-ec2-sg
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

# RDS SecurityGroup
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow RDS to EC2
      GroupName: raisetech-rds-sg
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

# ALB SecurityGroup
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http https to client host
      GroupName: raisetech-alb-sg
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref VpcCidr

# アウトプット
Outputs:
  ALBSecurityGroupId:
    Description: ALB SecurityGroup ID
    Value: !Ref ALBSecurityGroup

  InstanceSecurityGroupId:
    Description: EC2 SecurityGroup ID
    Value: !Ref InstanceSecurityGroup

  RDSSecurityGroupId:
    Description: RDS SecurityGroup ID
    Value: !Ref RDSSecurityGroup
